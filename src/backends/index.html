<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Acme Directory (multi-backend test fixture)</title>
<meta name="viewport" content="width=device-width, initial-scale=1"></head>
<body>
<h1>Acme Directory (test fixture)</h1>
<p>Deliberately misconfigured Firebase + Appwrite targets for SimplyScan. All data is fake.</p>
<ul id="list"></ul>
<!-- One script per backend: a library that fails to load must not stop the others. -->
<script type="module">
  const list = document.getElementById("list");
  const show = (src, name) => { const li = document.createElement("li"); li.textContent = `${src}: ${name}`; list.appendChild(li); };
  // Firebase (Realtime Database + Firestore)
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
  import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-database.js";
  import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
  const firebaseConfig = {
    apiKey: "{{FAKE_FIREBASE_WEB_KEY}}",
    authDomain: "simplyscan-testbed.firebaseapp.com",
    databaseURL: "https://simplyscan-testbed-default-rtdb.firebaseio.com",
    projectId: "simplyscan-testbed",
    storageBucket: "simplyscan-testbed.firebasestorage.app",
    messagingSenderId: "51463173293",
    appId: "1:51463173293:web:c48193f3efeba085aa4224",
  };
  const app = initializeApp(firebaseConfig);
  get(ref(getDatabase(app), "profiles")).then((s) => Object.values(s.val() || {}).forEach((p) => show("rtdb", p.full_name))).catch(() => {});
  getDocs(collection(getFirestore(app), "profiles")).then((q) => q.forEach((d) => show("firestore", d.data().full_name))).catch(() => {});
  getDocs(collection(getFirestore(app), "orders")).catch(() => {}); // locked control

</script>
<script type="module">
  const list = document.getElementById("list");
  const show = (src, name) => { const li = document.createElement("li"); li.textContent = `${src}: ${name}`; list.appendChild(li); };
  // GraphQL (Supabase pg_graphql on the test backend; fake data). G1 = plain query
  // in the code, G2 = locked control, G3 = persisted (hash-only) query whose document
  // is listed publicly in ./persisted-query-manifest.json, G4 = persisted query whose
  // document exists ONLY in a private registry (owner import test).
  const GRAPHQL = { url: "https://whicvhscrqqxnprjxxan.supabase.co/graphql/v1", key: "sb_publishable_1fbBZwEo9S3rhC3WuKg_8Q_tVyKHSVn" };
  const gql = (body) => fetch(GRAPHQL.url, { method: "POST", headers: { "Content-Type": "application/json", apikey: GRAPHQL.key }, body: JSON.stringify(body) }).then((r) => r.json()).catch(() => null);
  const PROFILES = { url: "https://whicvhscrqqxnprjxxan.supabase.co/graphql/v1", query: "query Profiles { profilesCollection(first: 5) { edges { node { full_name email phone } } } }" };
  const ORDERS = { url: "https://whicvhscrqqxnprjxxan.supabase.co/graphql/v1", query: "query Orders { ordersCollection(first: 5) { edges { node { customer_email total_cents } } } }" };
  gql({ query: PROFILES.query }).then((d) => (d?.data?.profilesCollection?.edges ?? []).forEach((e) => show("graphql", e.node.full_name)));
  gql({ query: ORDERS.query });
  gql({ operationName: "PublicProfiles", extensions: { persistedQuery: { version: 1, sha256Hash: "a406eb5585b06e4dbe62be129183a1e1a05423165926e27b4abec4ccf9334811" } } });
  gql({ operationName: "PrivateContacts", extensions: { persistedQuery: { version: 1, sha256Hash: "d9454c57275a7ab1e71d330ac51b5e4f618d3af5b9a6f3f3140df73637a054db" } } });

</script>
